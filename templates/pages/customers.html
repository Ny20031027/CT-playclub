{% extends 'layout.html' %}

{% block content %}
<script>
    document.getElementById('pageTitle').textContent = '客户管理';
</script>

<style>
    .customer-edit-modal { width:760px; max-width:calc(100vw - 32px); max-height:calc(100vh - 40px); display:flex; flex-direction:column; overflow:hidden; }
    .customer-edit-modal .modal-header { padding:20px 24px; border-bottom:1px solid #edf0f5; }
    .customer-edit-modal .modal-body { padding:22px 24px; overflow-y:auto; background:#f7f8fb; }
    .customer-edit-modal .modal-footer { padding:16px 24px; background:#fff; border-top:1px solid #edf0f5; }
    .edit-profile-strip { display:flex; align-items:center; gap:16px; margin-bottom:18px; padding:16px; border:1px solid #e7eaf1; border-radius:14px; background:linear-gradient(135deg,#fff,#f7f9ff); }
    .edit-profile-avatar { width:64px; height:64px; flex-shrink:0; display:flex; align-items:center; justify-content:center; overflow:hidden; border-radius:18px; color:#52617a; background:#e9edf5; font-size:26px; font-weight:700; box-shadow:0 7px 18px rgba(42,54,82,.1); }
    .edit-profile-copy { min-width:0; flex:1; }
    .edit-profile-name { margin-bottom:5px; color:#252b3b; font-size:17px; font-weight:700; }
    .edit-profile-meta { overflow:hidden; color:#8a93a5; font-size:12px; text-overflow:ellipsis; white-space:nowrap; }
    .edit-form-section { margin-top:14px; padding:18px; border:1px solid #e8ebf2; border-radius:14px; background:#fff; }
    .edit-form-section:first-of-type { margin-top:0; }
    .edit-section-title { display:flex; align-items:center; gap:8px; margin-bottom:16px; color:#31384c; font-size:14px; font-weight:700; }
    .edit-section-title i { color:#6979e8; }
    .edit-form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px 16px; }
    .edit-form-grid .form-group { margin:0; }
    .edit-form-section .form-group label { display:flex; align-items:center; gap:6px; margin-bottom:7px; color:#596174; font-size:13px; font-weight:600; }
    .edit-form-section input,.edit-form-section select,.edit-form-section textarea { width:100%; box-sizing:border-box; border:1px solid #dfe3eb; border-radius:9px; background:#fbfcfe; transition:border-color .2s,box-shadow .2s,background .2s; }
    .edit-form-section input:focus,.edit-form-section select:focus,.edit-form-section textarea:focus { border-color:#6979e8; background:#fff; box-shadow:0 0 0 3px rgba(105,121,232,.1); outline:none; }
    .display-id-field { position:relative; }
    .display-id-field input { padding-left:54px; color:#5b4517; font-weight:700; letter-spacing:1px; background:#fffdf5; border-color:#e6d39d; }
    .display-id-prefix { position:absolute; left:10px; top:33px; padding:3px 7px; border-radius:999px; color:#f4d77f; background:#17140f; font-size:10px; font-weight:800; }
    .field-hint { display:block; margin-top:5px; color:#9aa2b2; font-size:11px; font-weight:400; }
    @media (max-width:640px) { .edit-form-grid{grid-template-columns:1fr}.customer-edit-modal .modal-body{padding:16px}.edit-profile-meta{white-space:normal}.customer-edit-modal{max-width:calc(100vw - 20px)} }
</style>

<div class="card">
    <div class="card-header">
        <div class="card-title">客户列表</div>
        <div class="card-actions">
            <input type="text" class="search-input" id="searchInput" placeholder="搜索昵称/手机/微信/QQ">
            <button class="btn btn-primary" onclick="showModal('addCustomerModal')">
                <i class="fa-solid fa-plus"></i> 添加客户
            </button>
        </div>
    </div>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>头像</th>
                    <th>昵称</th>
                    <th>手机号</th>
                    <th>等级</th>
                    <th>消费金额</th>
                    <th>黑钻</th>
                    <th>订单数</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="customerList">
                <tr><td colspan="10" class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i><br>加载中...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- 添加客户弹窗 -->
<div class="modal-overlay" id="addCustomerModal">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title">添加客户</div>
            <div class="modal-close" onclick="hideModal('addCustomerModal')">&times;</div>
        </div>
        <div class="modal-body">
            <form id="addCustomerForm">
                <div class="form-group">
                    <label>昵称 <span style="color:red;">*</span></label>
                    <input type="text" id="custNickname" required>
                </div>
                <div class="form-group">
                    <label>手机号</label>
                    <input type="tel" id="custPhone">
                </div>
                <div class="form-group">
                    <label>性别</label>
                    <select id="custGender">
                        <option value="unknown">未知</option>
                        <option value="male">男</option>
                        <option value="female">女</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>等级</label>
                    <select id="custLevel"></select>
                </div>
                <div class="form-group">
                    <label>初始黑钻</label>
                    <input type="number" id="custCoins" value="0" min="0">
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <textarea id="custRemark" rows="2"></textarea>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-default" onclick="hideModal('addCustomerModal')">取消</button>
            <button class="btn btn-primary" onclick="addCustomer()">确定</button>
        </div>
    </div>
</div>

<!-- 编辑客户弹窗 -->
<div class="modal-overlay" id="editCustomerModal">
    <div class="modal customer-edit-modal">
        <div class="modal-header">
            <div class="modal-title">编辑客户</div>
            <div class="modal-close" onclick="hideModal('editCustomerModal')">&times;</div>
        </div>
        <div class="modal-body">
            <input type="hidden" id="editCustId">
            <div class="edit-profile-strip">
                <div id="editCustAvatar" class="edit-profile-avatar"></div>
                <div class="edit-profile-copy">
                    <div class="edit-profile-name" id="editCustHeader"></div>
                    <div class="edit-profile-meta" id="editCustMeta"></div>
                </div>
            </div>
            <div class="edit-form-section">
                <div class="edit-section-title"><i class="fa-solid fa-id-card"></i> 基础资料</div>
                <div class="edit-form-grid">
                    <div class="form-group"><label>昵称</label><input type="text" id="editNickname"></div>
                    <div class="form-group display-id-field"><label>黑金ID</label><span class="display-id-prefix">ID</span><input type="text" id="editDisplayId" inputmode="numeric" maxlength="9" placeholder="1至9位数字"><small class="field-hint">全站唯一，用户搜索和身份识别使用</small></div>
                    <div class="form-group"><label>手机号</label><input type="tel" id="editPhone"></div>
                    <div class="form-group"><label>性别</label><select id="editGender"><option value="unknown">未知</option><option value="male">男</option><option value="female">女</option></select></div>
                    <div class="form-group"><label>年龄</label><input type="number" id="editAge" min="0" max="120"></div>
                    <div class="form-group"><label>等级</label><select id="editLevel"></select></div>
                    <div class="form-group"><label>状态</label><select id="editStatus"><option value="true">正常</option><option value="false">禁用</option></select></div>
                </div>
            </div>
            <div class="edit-form-section">
                <div class="edit-section-title"><i class="fa-solid fa-wallet"></i> 账户与联系信息</div>
                <div class="edit-form-grid">
                    <div class="form-group"><label>黑钻</label><input type="number" id="editCoins" min="0"></div>
                    <div class="form-group"><label>微信号</label><input type="text" id="editWechat"></div>
                    <div class="form-group"><label>QQ号</label><input type="text" id="editQq"></div>
                </div>
            </div>
            <div class="edit-form-section">
                <div class="edit-section-title"><i class="fa-solid fa-note-sticky"></i> 管理备注</div>
                <div class="form-group" style="margin:0;"><textarea id="editRemark" rows="3" placeholder="填写客户偏好或内部备注"></textarea></div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-default" onclick="hideModal('editCustomerModal')">取消</button>
            <button class="btn btn-primary" onclick="saveCustomer()">保存</button>
        </div>
    </div>
</div>

<!-- 客户详情弹窗 -->
<div class="modal-overlay" id="viewCustomerModal">
    <div class="modal" style="max-width: 800px;">
        <div class="modal-header">
            <div class="modal-title">客户详情</div>
            <div class="modal-close" onclick="hideModal('viewCustomerModal')">&times;</div>
        </div>
        <div class="modal-body" id="viewCustomerBody"></div>
        <div class="modal-footer">
            <button class="btn btn-default" onclick="hideModal('viewCustomerModal')">关闭</button>
            <button class="btn btn-primary" id="goEditBtn" onclick="">编辑</button>
        </div>
    </div>
</div>

<!-- 封禁弹窗 -->
<div class="modal-overlay" id="banModal">
    <div class="modal" style="max-width: 420px;">
        <div class="modal-header">
            <div class="modal-title">封禁账号</div>
            <div class="modal-close" onclick="hideModal('banModal')">&times;</div>
        </div>
        <div class="modal-body">
            <p style="color:#666;margin-bottom:15px;">封禁后，<b id="banTargetName"></b>将无法登录。请选择封禁时长：</p>
            <input type="hidden" id="banTargetId">
            <div class="form-group">
                <label>封禁时长</label>
                <select id="banDurationType" onchange="toggleBanDuration()">
                    <option value="hours">按小时</option>
                    <option value="days">按天</option>
                    <option value="forever" selected>永久封禁</option>
                </select>
            </div>
            <div class="form-group" id="banDurationWrap" style="display:none;">
                <label>时长数值</label>
                <input type="number" id="banDuration" min="1" value="1">
            </div>
            <div class="form-group">
                <label>封禁原因（可选）</label>
                <input type="text" id="banReason" placeholder="如：违规行为">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-default" onclick="hideModal('banModal')">取消</button>
            <button class="btn btn-danger" onclick="confirmBan()">确认封禁</button>
        </div>
    </div>
</div>

<!-- 发放优惠券弹窗 -->
<div class="modal-overlay" id="issueCouponModal">
    <div class="modal" style="max-width: 480px;">
        <div class="modal-header">
            <div class="modal-title">发放优惠券</div>
            <div class="modal-close" onclick="hideModal('issueCouponModal')">&times;</div>
        </div>
        <div class="modal-body">
            <p style="color:#666;margin-bottom:15px;">向 <b id="issueTargetName"></b> 发放优惠券：</p>
            <input type="hidden" id="issueTargetId">
            <div class="form-group">
                <label>选择优惠券 <span style="color:red;">*</span></label>
                <select id="issueCouponId">
                    <option value="">-- 请选择 --</option>
                </select>
            </div>
            <div class="form-group">
                <label>发放数量</label>
                <input type="number" id="issueCouponQty" value="1" min="1" max="100">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-default" onclick="hideModal('issueCouponModal')">取消</button>
            <button class="btn btn-primary" onclick="confirmIssueCoupon()">确认发放</button>
        </div>
    </div>
</div>


<script>
    let customerLevels = [];
    let currentViewingId = null;

    document.addEventListener('DOMContentLoaded', async function() {
        await loadLevels();
        await loadCustomers();

        document.getElementById('searchInput').addEventListener('input', debounce(async function() {
            await loadCustomers();
        }, 300));
    });

    async function loadLevels() {
        try {
            const result = await get('/customer/levels/?status=true&page_size=100');
            if (result.code === 200) {
                customerLevels = result.data.results || result.data || [];
                fillLevelSelects();
            }
        } catch (e) {
            console.error('加载等级失败:', e);
        }
    }

    function fillLevelSelects() {
        const addSel = document.getElementById('custLevel');
        const editSel = document.getElementById('editLevel');
        const opts = '<option value="">-- 选择等级 --</option>' +
            customerLevels.map(l => `<option value="${l.id}">${l.name}</option>`).join('');
        if (addSel) addSel.innerHTML = opts;
        if (editSel) editSel.innerHTML = opts;
    }

    function getLevelText(levelId) {
        if (!levelId) return '未设置';
        const l = customerLevels.find(x => x.id === levelId);
        return l ? l.name : '等级' + levelId;
    }

    function getLevelBadge(levelId) {
        const l = customerLevels.find(x => x.id === levelId);
        if (!l) return 'badge-info';
        const color = l.color || '#1890ff';
        return 'badge';
    }

    async function loadCustomers() {
        const keyword = document.getElementById('searchInput').value.trim();
        try {
            const params = {};
            if (keyword) params.search = keyword;
            const result = await get('/customer/customers/', params);
            if (result.code === 200) {
                const customers = result.data.results || result.data || [];
                const tbody = document.getElementById('customerList');

                if (customers.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="10" class="empty-state"><i class="fa-solid fa-inbox"></i><br>暂无数据</td></tr>';
                    return;
                }

                tbody.innerHTML = customers.map(cust => {
                    const statusBadge = cust.status
                        ? '<span class="badge badge-success">正常</span>'
                        : '<span class="badge badge-danger">禁用</span>';
                    const banDeadline = cust.ban_detail?.permanent
                        ? '永久封禁'
                        : (cust.ban_detail?.ban_until_display ? `封禁至 ${cust.ban_detail.ban_until_display}` : '已封禁');
                    const banBadge = cust.user_banned
                        ? `<span class="badge badge-danger" title="${banDeadline}">${banDeadline}</span>`
                        : '';
                    const freezeBadge = cust.coins_frozen
                        ? '<span class="badge badge-warning">💎已冻结</span>'
                        : '';
                    const levelBadge = cust.level
                        ? `<span class="badge" style="background:${cust.level_color || '#1890ff'};color:white;">${cust.level_name || getLevelText(cust.level)}</span>`
                        : '<span class="badge badge-info">未设置</span>';
                    const totalSpent = cust.total_amount || cust.total_spent || 0;
                    return `
                        <tr>
                            <td>${cust.id}</td>
                            <td>${avatarHtml(cust, 40)}</td>
                            <td>${cust.nickname || '-'}</td>
                            <td>${cust.phone || '-'}</td>
                            <td>${levelBadge}</td>
                            <td>¥${Number(totalSpent).toFixed(2)}</td>
                            <td><span class="badge badge-warning">💎 ${cust.coins || 0}</span> ${freezeBadge}</td>
                            <td>${cust.total_orders || cust.order_count || 0}</td>
                            <td>${statusBadge} ${banBadge}</td>
                            <td>
                                <button class="btn btn-default btn-sm" onclick="viewCustomer(${cust.id})">查看</button>
                                <button class="btn btn-primary btn-sm" onclick="editCustomer(${cust.id})">编辑</button>
                                ${cust.user_banned
                                    ? `<button class="btn btn-warning btn-sm" onclick="unbanCustomer(${cust.id})">解封</button>`
                                    : `<button class="btn btn-warning btn-sm" onclick="openBanModal(${cust.id}, decodeURIComponent('${encodeURIComponent(cust.nickname || '客户')}'))">封禁</button>`}
                                <button class="btn btn-info btn-sm" onclick="toggleFreezeCoins(${cust.id}, ${cust.coins_frozen ? 'false' : 'true'})">${cust.coins_frozen ? '解冻黑钻' : '冻结黑钻'}</button>
                                <button class="btn btn-success btn-sm" onclick="showIssueCouponModal(${cust.id}, decodeURIComponent('${encodeURIComponent(cust.nickname || '客户')}'))">🎫 发券</button>
                            </td>
                        </tr>
                    `;
                }).join('');
            }
        } catch (error) {
            console.error('加载客户数据失败:', error);
        }
    }

    async function addCustomer() {
        const nickname = document.getElementById('custNickname').value.trim();
        if (!nickname) { showToast('请输入昵称', 'error'); return; }
        const phone = document.getElementById('custPhone').value.trim();
        const gender = document.getElementById('custGender').value;
        const levelId = document.getElementById('custLevel').value;
        const coins = parseInt(document.getElementById('custCoins').value) || 0;
        const remark = document.getElementById('custRemark').value.trim();

        const payload = { nickname, phone, gender, coins, remark };
        if (levelId) payload.level = parseInt(levelId);

        try {
            const result = await post('/customer/customers/', payload);
            if (result.code === 200) {
                if (coins > 0 && result.data && result.data.id) {
                    await post('/customer/customers/' + result.data.id + '/add_coins/', { amount: coins, remark: '初始充值' });
                }
                showToast('添加成功', 'success');
                hideModal('addCustomerModal');
                document.getElementById('addCustomerForm').reset();
                document.getElementById('custCoins').value = '0';
                await loadCustomers();
            } else {
                showToast(result.msg || '添加失败', 'error');
            }
        } catch (error) {
            showToast(error.message, 'error');
        }
    }

    async function editCustomer(id) {
        try {
            const result = await get(`/customer/customers/${id}/`);
            if (result.code === 200) {
                const c = result.data;
                document.getElementById('editCustId').value = c.id;
                document.getElementById('editNickname').value = c.nickname || '';
                document.getElementById('editDisplayId').value = c.display_id || '';
                document.getElementById('editPhone').value = c.phone || '';
                document.getElementById('editGender').value = c.gender || 'unknown';
                document.getElementById('editAge').value = c.age || '';
                document.getElementById('editLevel').value = c.level || '';
                document.getElementById('editStatus').value = c.status !== false ? 'true' : 'false';
                document.getElementById('editCoins').value = c.coins || 0;
                document.getElementById('editWechat').value = c.wechat || '';
                document.getElementById('editQq').value = c.qq || '';
                document.getElementById('editRemark').value = c.remark || '';

                document.getElementById('editCustHeader').textContent = c.nickname || '-';
                const metaParts = [];
                if (c.level_name) metaParts.push(c.level_name);
                if (c.phone) metaParts.push(c.phone);
                metaParts.push(`累计消费 ¥${Number(c.total_amount || 0).toFixed(2)}`);
                metaParts.push(`黑钻 ${c.coins || 0}`);
                metaParts.push(`订单 ${c.total_orders || 0}`);
                document.getElementById('editCustMeta').textContent = metaParts.join(' · ');

                const avatarEl = document.getElementById('editCustAvatar');
                if (c.avatar_url) {
                    avatarEl.innerHTML = `<img src="${c.avatar_url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
                } else {
                    avatarEl.textContent = (c.nickname || '?').charAt(0);
                }

                showModal('editCustomerModal');
            } else {
                showToast(result.msg || '获取客户信息失败', 'error');
            }
        } catch (error) {
            showToast(error.message, 'error');
        }
    }

    async function saveCustomer() {
        const id = document.getElementById('editCustId').value;
        const payload = {
            edit_display_id: document.getElementById('editDisplayId').value.trim(),
            nickname: document.getElementById('editNickname').value.trim(),
            phone: document.getElementById('editPhone').value.trim(),
            gender: document.getElementById('editGender').value,
            age: parseInt(document.getElementById('editAge').value) || null,
            level: parseInt(document.getElementById('editLevel').value) || null,
            status: document.getElementById('editStatus').value === 'true',
            coins: parseInt(document.getElementById('editCoins').value) || 0,
            wechat: document.getElementById('editWechat').value.trim(),
            qq: document.getElementById('editQq').value.trim(),
            remark: document.getElementById('editRemark').value.trim(),
        };

        if (!/^\d{1,9}$/.test(payload.edit_display_id)) {
            showToast('黑金ID只能填写1至9位数字', 'error');
            return;
        }

        try {
            const result = await put(`/customer/customers/${id}/`, payload);
            if (result.code === 200) {
                showToast('保存成功', 'success');
                hideModal('editCustomerModal');
                await loadCustomers();
            } else {
                showToast(result.msg || '保存失败', 'error');
            }
        } catch (error) {
            showToast(error.message, 'error');
        }
    }

    async function viewCustomer(id) {
        currentViewingId = id;
        const body = document.getElementById('viewCustomerBody');
        body.innerHTML = '<div style="text-align:center;padding:40px;"><i class="fa-solid fa-spinner fa-spin"></i></div>';
        showModal('viewCustomerModal');
        document.getElementById('goEditBtn').setAttribute('onclick', `hideModal('viewCustomerModal');editCustomer(${id})`);

        try {
            const [custRes, orderRes, recordRes] = await Promise.all([
                get(`/customer/customers/${id}/`),
                get(`/customer/customers/${id}/orders/?page_size=5`),
                get(`/customer/customers/${id}/consume-records/?page_size=5`),
            ]);

            const c = custRes.code === 200 ? custRes.data : {};
            const orders = orderRes.code === 200 ? (orderRes.data.results || orderRes.data || []) : [];
            const records = recordRes.code === 200 ? (recordRes.data.results || recordRes.data || []) : [];

            const avatarHtml = c.avatar_url
                ? `<img src="${c.avatar_url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`
                : (c.nickname || '?').charAt(0);

            body.innerHTML = `
                <div style="display:flex;gap:20px;margin-bottom:20px;">
                    <div style="width:80px;height:80px;border-radius:50%;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:32px;color:#999;overflow:hidden;">${avatarHtml}</div>
                    <div style="flex:1;">
                        <div style="font-size:18px;font-weight:600;">${c.nickname || '-'}</div>
                        <div style="color:#909399;font-size:13px;margin:4px 0;">
                            ${c.level_name || '未设置等级'} ${c.phone ? '· ' + c.phone : ''}
                        </div>
                        <div style="display:flex;gap:16px;margin-top:10px;">
                            <div><span style="color:#999;">黑钻</span> <b>💎${c.coins || 0}</b></div>
                            <div><span style="color:#999;">余额</span> <b>¥${Number(c.balance || 0).toFixed(2)}</b></div>
                            <div><span style="color:#999;">累计消费</span> <b>¥${Number(c.total_amount || 0).toFixed(2)}</b></div>
                            <div><span style="color:#999;">订单数</span> <b>${c.total_orders || 0}</b></div>
                        </div>
                        <div style="margin-top:6px;">
                            <span class="badge ${c.status ? 'badge-success' : 'badge-danger'}">${c.status ? '正常' : '禁用'}</span>
                            ${c.wechat ? '<span style="margin-left:8px;color:#999;">微信: ' + c.wechat + '</span>' : ''}
                            ${c.qq ? '<span style="margin-left:8px;color:#999;">QQ: ' + c.qq + '</span>' : ''}
                        </div>
                        ${c.remark ? '<div style="margin-top:6px;color:#999;font-size:12px;">备注: ' + c.remark + '</div>' : ''}
                    </div>
                </div>
                <div style="border-top:1px solid #f0f0f0;padding-top:16px;margin-bottom:16px;">
                    <div style="font-weight:600;margin-bottom:8px;">最近订单</div>
                    ${orders.length === 0
                        ? '<div style="color:#999;text-align:center;padding:12px;">暂无订单</div>'
                        : '<table style="width:100%;font-size:12px;"><thead><tr style="color:#999;"><th style="text-align:left;">订单号</th><th style="text-align:left;">技能/游戏</th><th style="text-align:right;">金额</th><th style="text-align:left;">状态</th><th style="text-align:left;">时间</th></tr></thead><tbody>' +
                        orders.map(o => `<tr><td>${o.order_no || '-'}</td><td>${o.skill_name || '-'} ${o.game_name ? '· ' + o.game_name : ''}</td><td style="text-align:right;">¥${Number(o.total_amount || 0).toFixed(2)}</td><td>${o.status_text || o.status || '-'}</td><td>${o.created_at ? o.created_at.substring(0, 16) : '-'}</td></tr>`).join('') +
                        '</tbody></table>'
                    }
                </div>
                <div style="border-top:1px solid #f0f0f0;padding-top:16px;">
                    <div style="font-weight:600;margin-bottom:8px;">消费流水</div>
                    ${records.length === 0
                        ? '<div style="color:#999;text-align:center;padding:12px;">暂无流水</div>'
                        : '<table style="width:100%;font-size:12px;"><thead><tr style="color:#999;"><th style="text-align:left;">类型</th><th style="text-align:left;">订单号</th><th style="text-align:right;">金额</th><th style="text-align:left;">备注</th><th style="text-align:left;">时间</th></tr></thead><tbody>' +
                        records.map(r => `<tr><td>${r.type || '-'}</td><td>${r.order_no || '-'}</td><td style="text-align:right;">¥${Number(r.amount || 0).toFixed(2)}</td><td>${r.remark || '-'}</td><td>${r.created_at ? r.created_at.substring(0, 16) : '-'}</td></tr>`).join('') +
                        '</tbody></table>'
                    }
                </div>
            `;
        } catch (error) {
            body.innerHTML = `<div style="color:red;text-align:center;padding:40px;">加载失败: ${error.message}</div>`;
        }
    }

    async function deleteCustomer(id) {
        if (!confirm('确定要删除该客户吗？')) return;
        try {
            const result = await del(`/customer/customers/${id}/`);
            if (result.code === 200) {
                showToast('删除成功', 'success');
                await loadCustomers();
            } else {
                showToast(result.msg || '删除失败', 'error');
            }
        } catch (error) {
            showToast(error.message, 'error');
        }
    }

    // ============ 封禁 / 冻结 ============
    let banApiPrefix = '/customer/customers';
    let banUnbanPath = (id) => `${banApiPrefix}/${id}/ban/`;

    function openBanModal(id, name) {
        document.getElementById('banTargetId').value = id;
        document.getElementById('banTargetName').textContent = name;
        document.getElementById('banDurationType').value = 'forever';
        document.getElementById('banDurationWrap').style.display = 'none';
        document.getElementById('banReason').value = '';
        showModal('banModal');
    }

    function toggleBanDuration() {
        const type = document.getElementById('banDurationType').value;
        document.getElementById('banDurationWrap').style.display = type === 'forever' ? 'none' : 'block';
    }

    async function confirmBan() {
        const id = document.getElementById('banTargetId').value;
        const durationType = document.getElementById('banDurationType').value;
        const duration = document.getElementById('banDuration').value;
        const reason = document.getElementById('banReason').value.trim();
        try {
            const result = await post(`${banApiPrefix}/${id}/ban/`, {
                duration_type: durationType,
                duration: duration || 1,
                reason: reason,
            });
            if (result.code === 200) {
                showToast('封禁成功', 'success');
                hideModal('banModal');
                await loadCustomers();
            } else {
                showToast(result.msg || '封禁失败', 'error');
            }
        } catch (error) {
            showToast(error.message, 'error');
        }
    }

    async function unbanCustomer(id) {
        if (!confirm('确定要解封该客户吗？')) return;
        try {
            const result = await post(`/customer/customers/${id}/unban/`, {});
            if (result.code === 200) {
                showToast('已解封', 'success');
                await loadCustomers();
            } else {
                showToast(result.msg || '解封失败', 'error');
            }
        } catch (error) {
            showToast(error.message, 'error');
        }
    }

    async function toggleFreezeCoins(id, frozen) {
        try {
            const result = await post(`/customer/customers/${id}/freeze-coins/`, { frozen: !!frozen });
            if (result.code === 200) {
                showToast(frozen ? '黑钻已冻结' : '黑钻已解冻', 'success');
                await loadCustomers();
            } else {
                showToast(result.msg || '操作失败', 'error');
            }
        } catch (error) {
            showToast(error.message, 'error');
        }
    }

    // ============ 优惠券发放 ============
    async function showIssueCouponModal(customerId, customerName) {
        document.getElementById('issueTargetId').value = customerId;
        document.getElementById('issueTargetName').textContent = customerName;
        document.getElementById('issueCouponQty').value = '1';
        // 加载可用优惠券列表
        try {
            const result = await get('/system/coupons/?is_enabled=true');
            const coupons = result.code === 200 ? (result.data.results || result.data || []) : [];
            const sel = document.getElementById('issueCouponId');
            sel.innerHTML = '<option value="">-- 请选择 --</option>' +
                coupons.map(c => `<option value="${c.id}">${c.name}（${c.discount_rate}%折扣）</option>`).join('');
        } catch (e) {
            console.error('加载优惠券失败', e);
        }
        showModal('issueCouponModal');
    }

    async function confirmIssueCoupon() {
        const customerId = document.getElementById('issueTargetId').value;
        const couponId = document.getElementById('issueCouponId').value;
        const quantity = parseInt(document.getElementById('issueCouponQty').value) || 1;

        if (!couponId) { showToast('请选择优惠券', 'error'); return; }
        if (quantity < 1) { showToast('发放数量至少为1', 'error'); return; }

        try {
            const result = await post('/system/user-coupons/issue/', {
                customer_id: parseInt(customerId),
                coupon_id: parseInt(couponId),
                quantity: quantity,
            });
            if (result.code === 200) {
                showToast(result.msg || '发放成功', 'success');
                hideModal('issueCouponModal');
            } else {
                showToast(result.msg || '发放失败', 'error');
            }
        } catch (e) {
            showToast(e.message || '发放失败', 'error');
        }
    }
</script>
{% endblock %}
